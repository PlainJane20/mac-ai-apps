<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062430"/>
      <stop offset="0.5" stop-color="#0b5a72"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <filter id="lineShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#01131a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="420" fill="url(#glow)"/>

  <!-- faint concentric rings, like a radar/vitals sweep -->
  <g stroke="#e6fffb" stroke-opacity="0.14" fill="none" stroke-width="6">
    <circle cx="512" cy="512" r="330"/>
    <circle cx="512" cy="512" r="250"/>
  </g>

  <!-- EKG / pulse waveform, bold and centered -->
  <g filter="url(#lineShadow)">
    <path d="M 140 540
             L 350 540
             L 410 420
             L 470 640
             L 540 300
             L 610 700
             L 670 540
             L 884 540"
          fill="none"
          stroke="#f0fdfa"
          stroke-width="34"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- pulse dot at the leading edge -->
  <circle cx="884" cy="540" r="26" fill="#5eead4"/>
  <circle cx="884" cy="540" r="46" fill="none" stroke="#5eead4" stroke-opacity="0.5" stroke-width="8"/>
</svg>
