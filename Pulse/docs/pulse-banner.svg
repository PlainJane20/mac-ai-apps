<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Pulse</title>
  <desc id="description">Native menu bar Jira sprint brief, summarized by a local LLM.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062430"/>
      <stop offset="0.56" stop-color="#0b5a72"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".72"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".28"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#01131a" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="1035" cy="55" r="230" fill="url(#glow)"/>
  <g opacity=".16" stroke="#5eead4" stroke-width="1.2" fill="none">
    <circle cx="1035" cy="150" r="90"/>
    <circle cx="1035" cy="150" r="130"/>
  </g>
  <g transform="translate(74 68)" filter="url(#shadow)">
    <rect width="88" height="88" rx="22" fill="#0a3a48" stroke="#5eead4" stroke-opacity=".58"/>
    <path d="M18 44h16l7-16 12 32 8-16h19" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="190" y="112" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="50" font-weight="750" letter-spacing="-1">Pulse</text>
  <text x="192" y="153" fill="#5eead4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2.5">NATIVE MENU BAR JIRA SPRINT BRIEF</text>
  <text x="75" y="225" fill="#dcfbf5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Your tickets, any active sprint, any project — summarized</text>
  <text x="75" y="258" fill="#dcfbf5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">by a local LLM. Nothing leaves your machine.</text>
  <g transform="translate(775 168)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">
    <g transform="translate(0 0)"><rect width="128" height="42" rx="21" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".2"/><text x="64" y="26" text-anchor="middle" fill="#edfcf9">Ollama · Local LLM</text></g>
    <g transform="translate(138 0)"><rect width="96" height="42" rx="21" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".2"/><text x="48" y="26" text-anchor="middle" fill="#edfcf9">Jira REST API</text></g>
    <g transform="translate(244 0)"><rect width="108" height="42" rx="21" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".2"/><text x="54" y="26" text-anchor="middle" fill="#edfcf9">SwiftUI Menu Bar</text></g>
  </g>
</svg>
