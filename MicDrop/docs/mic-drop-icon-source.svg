<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a0f0a"/>
      <stop offset="0.5" stop-color="#b3401f"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fed7aa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fed7aa" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1a0502" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="470" r="380" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <!-- microphone body -->
    <rect x="422" y="220" width="180" height="300" rx="90" fill="#fff7ed"/>
    <!-- mic stand arc -->
    <path d="M 320 480 a 192 192 0 0 0 384 0"
          fill="none" stroke="#fff7ed" stroke-width="34" stroke-linecap="round"/>
    <!-- stand base -->
    <line x1="512" y1="672" x2="512" y2="760" stroke="#fff7ed" stroke-width="34" stroke-linecap="round"/>
    <line x1="400" y1="760" x2="624" y2="760" stroke="#fff7ed" stroke-width="34" stroke-linecap="round"/>
  </g>

  <!-- clean sound wave to the right, representing babble -> clean speech -->
  <g stroke="#fed7aa" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.95">
    <line x1="700" y1="430" x2="700" y2="470"/>
    <line x1="740" y1="390" x2="740" y2="510"/>
    <line x1="780" y1="410" x2="780" y2="490"/>
    <line x1="820" y1="370" x2="820" y2="530"/>
  </g>
</svg>
